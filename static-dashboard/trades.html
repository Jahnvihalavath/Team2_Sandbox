<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ReconX - Trades</title>

  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="layout__header" role="banner">
    <h1 class="layout__title">ReconX</h1>

    <nav class="layout__nav" aria-label="Main navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="trades.html" aria-current="page">Trades</a>
        <a href="recon.html">Recon</a>
    </nav>

    <button id="theme-toggle">🌗</button>
</header>

<aside class="layout__sidebar">
    <h2>Quick filters</h2>

    <ul>
        <li>All trades</li>
        <li>Open breaks</li>
        <li>Today</li>
    </ul>
</aside>

<main class="layout__main">

<h2>Trades</h2>

<div class="table-scroll">

<table class="data-table" id="trades-table">

<thead>

<tr>

<th data-col="tradeRef" data-dir="asc">
Trade Ref
<span class="resize-handle"></span>
</th>

<th data-col="symbol" data-dir="asc">
Instrument
<span class="resize-handle"></span>
</th>

<th data-col="quantity" data-dir="asc" data-type="number">
Quantity
<span class="resize-handle"></span>
</th>

<th data-col="price" data-dir="asc" data-type="number">
Price
<span class="resize-handle"></span>
</th>

<th data-col="status" data-dir="asc">
Status
<span class="resize-handle"></span>
</th>

</tr>

</thead>

<tbody id="trades-tbody">

</tbody>

</table>

</div>

</main>

<footer class="layout__footer">
ReconX TDI 2026
</footer>

<script src="js/trades.js"></script>

</body>

</html>
